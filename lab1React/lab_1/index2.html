<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тарифні плани — ЛР2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section class="pricing">
    <div class="container">

      <div class="pricing-header">
        <h2>Наші тарифи</h2>
        <p>Оберіть план, який найкраще підходить для ваших завдань</p>
      </div>

      <div class="cards-wrapper">

        <!-- Basic -->
        <div class="card">
          <span class="card-type">BASIC</span>
          <div class="price">$10 <span>/ month</span></div>
          <ul class="features">
            <li>✓ 1 User</li>
            <li>✓ 5GB Storage</li>
            <li>✓ Basic Support</li>
          </ul>
          <button class="btn btn-outline">Select</button>
        </div>

        <!-- Pro (Активний) -->
        <div class="card card-featured">
          <div class="badge">PRO • ACTIVE</div>
          <span class="card-type">PRO</span>
          <div class="price">$29 <span>/ month</span></div>
          <ul class="features">
            <li>✓ 5 Users</li>
            <li>✓ 50GB Storage</li>
            <li>✓ Priority Support</li>
          </ul>
          <button class="btn btn-primary">Get Started</button>
        </div>

        <!-- Enterprise -->
        <div class="card">
          <span class="card-type">ENTERPRISE</span>
          <div class="price">$99 <span>/ month</span></div>
          <ul class="features">
            <li>✓ Unlimited</li>
            <li>✓ 1TB Storage</li>
            <li>✓ 24/7 Support</li>
          </ul>
          <button class="btn btn-outline">Contact</button>
        </div>

      </div>

    </div>
  </section>

</body>
</html>
