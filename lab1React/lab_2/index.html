<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тарифні плани</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <section class="tariffs">
    <div class="tariffs-container">
      
      <header class="tariffs-header">
        <h2>Наші тарифи</h2>
        <p>Оберіть план, який найкраще підходить для ваших завдань</p>
      </header>

      <div class="tariffs-list">
        
        <!-- Картка 1: Basic -->
        <article class="tariff-card">
          <h3 class="plan-title">Basic</h3>
          <div class="plan-price">$10 <span>/ month</span></div>
          <ul class="plan-features">
            <li>1 User</li>
            <li>5GB Storage</li>
            <li>Basic Support</li>
          </ul>
          <button class="btn">Select</button>
        </article>

        <!-- Картка 2: Pro (Active/Popular) -->
        <article class="tariff-card tariff-card--featured">
          <span class="plan-badge">PRO • ACTIVE</span>
          <h3 class="plan-title">Pro</h3>
          <div class="plan-price">$29 <span>/ month</span></div>
          <ul class="plan-features">
            <li>5 Users</li>
            <li>50GB Storage</li>
            <li>Priority Support</li>
          </ul>
          <button class="btn btn--primary">Get Started</button>
        </article>

        <!-- Картка 3: Enterprise -->
        <article class="tariff-card">
          <h3 class="plan-title">Enterprise</h3>
          <div class="plan-price">$99 <span>/ month</span></div>
          <ul class="plan-features">
            <li>Unlimited</li>
            <li>1TB Storage</li>
            <li>24/7 Support</li>
          </ul>
          <button class="btn">Contact</button>
        </article>

      </div>

    </div>
  </section>

</body>
</html>
